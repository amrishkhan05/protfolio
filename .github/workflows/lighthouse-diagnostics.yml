name: Lighthouse SEO and Best Practices diagnostics
on:
  push:
    branches: [feature/editorial-writing-experience]
    paths:
      - .github/workflows/lighthouse-diagnostics.yml
      - public/**
      - app.js
      - api/**
      - vercel.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production server and Lighthouse
        run: |
          npm ci
          npm install --no-save lighthouse@12.8.2
          google-chrome --version || chromium --version
      - name: Start local site
        run: |
          npm start > /tmp/lighthouse-portfolio-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3333/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lighthouse-portfolio-server.log
          exit 1
      - name: Run local and deployed Lighthouse
        run: |
          mkdir -p lighthouse-reports
          for case in homepage-local aruvix-local homepage-preview; do
            case "$case" in
              homepage-local) URL="http://127.0.0.1:3333/" ;;
              aruvix-local) URL="http://127.0.0.1:3333/aruvix" ;;
              homepage-preview) URL="https://protfolio-git-feature-editorial-w-d67f8c-amrishkhan05s-projects.vercel.app/" ;;
            esac
            echo "::group::Lighthouse $case $URL"
            npx lighthouse "$URL" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=best-practices,seo \
              --output=json --output-path="lighthouse-reports/$case.json" \
              --quiet --max-wait-for-load=50000 || echo "AUDIT FAILED for $case"
            node - "$case" <<'NODE'
          const fs=require("fs");
          const label=process.argv[2],p="lighthouse-reports/"+label+".json";
          if(!fs.existsSync(p)){console.log(label,"NO_REPORT");process.exit(0)}
          const r=JSON.parse(fs.readFileSync(p,"utf8"));
          console.log("TARGET",label,"URL",r.finalDisplayedUrl,"Lighthouse",r.lighthouseVersion,
             "scores",Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,v.score*100])));
          const ids=new Set(Object.values(r.categories).flatMap(c=>c.auditRefs.filter(a=>a.weight>0).map(a=>a.id)));
          for(const id of ids){const a=r.audits[id];
            if(a&&a.score!==null&&a.score<1){
              console.log("FAIL",id,"score",a.score,"title",a.title,"details",a.displayValue||"");
              for(const item of (a.details?.items||[]).slice(0,6)){
                console.log("  ITEM",JSON.stringify(item).slice(0,750));
              }
            }
          }
          console.log("CONSOLE",r.audits["errors-in-console"]?.details?.items?.slice(0,10)||[]);
          NODE
            echo "::endgroup::"
          done
      - name: Upload Lighthouse JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-diagnostic-json
          path: lighthouse-reports/*.json
          if-no-files-found: warn
