name: Portfolio branch quality
on:
  push:
    branches:
      - feature/editorial-writing-experience
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run portfolio checks
        run: npm test
